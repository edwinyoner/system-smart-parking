; Cámara de entrada o salida (escenario A): Freenove ESP32-S3 WROOM CAM (OV2640)
; Compilar: pio run    Grabar: pio run -t upload    Ver mensajes: pio device monitor

[env:freenove_esp32s3_cam]
; pioarduino: Arduino-ESP32 3.x (la plataforma oficial de PlatformIO se quedó en la 2.x)
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; Módulo ESP32-S3-WROOM-1 con PSRAM octal (N8R8 o N16R8): las fotos se guardan en la PSRAM
board_build.arduino.memory_type = qio_opi
board_build.flash_size = 8MB
board_upload.flash_size = 8MB
board_build.partitions = default_8MB.csv
build_flags =
  -DBOARD_HAS_PSRAM
  -DCORE_DEBUG_LEVEL=1

; Código común (WiFi, HTTP, HC-SR04) en iot/shared
lib_extra_dirs = ../shared
; (las dependencias de la librería común se declaran aquí: PlatformIO no las instala solas)
lib_deps =
  bblanchon/ArduinoJson@^7.2.1
  knolleary/PubSubClient@^2.8
