; Panel LED de disponibilidad: ESP32-S3-DevKitC-1 N16R8 + 2 paneles HUB75 P5 64x32 en cadena
; Compilar: pio run    Grabar: pio run -t upload    Ver mensajes: pio device monitor

[env:esp32s3_devkitc_n16r8]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

board_build.arduino.memory_type = qio_opi
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
build_flags =
  -DBOARD_HAS_PSRAM
  -DCORE_DEBUG_LEVEL=1

; Código común en iot/shared (sus dependencias se declaran aquí)
lib_extra_dirs = ../shared
lib_deps =
  bblanchon/ArduinoJson@^7.2.1
  knolleary/PubSubClient@^2.8
  adafruit/Adafruit GFX Library@^1.11.11
  mrfaptastic/ESP32 HUB75 LED MATRIX PANEL DMA Display@^3.1.1
