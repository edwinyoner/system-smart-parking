<!-- Layout de las páginas públicas: login, recuperar y restablecer contraseña, verificar correo -->
<div class="auth-layout">
  <div class="auth-container">

    <!-- Cabecera con el nombre del sistema -->
    <div class="auth-header">
      <h1 class="app-name">{{ appName }}</h1>
      <p class="company-name">{{ companyName }}</p>
    </div>

    <!-- Formulario -->
    <div class="auth-card">
      <router-outlet></router-outlet>
    </div>

    <!-- Pie -->
    <div class="auth-footer">
      <p class="copyright">&copy; {{ currentYear }} {{ companyName }}<br>Todos los derechos reservados.</p>
      <p class="location"><i class="fas fa-map-marker-alt"></i> Huaraz, Áncash, Perú</p>
    </div>

  </div>
</div>
