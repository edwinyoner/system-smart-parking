<!--sidebar-->
<!-- Sin colorScheme: el menú sigue el tema elegido (claro, oscuro o automático) -->
<c-sidebar #sidebar1="cSidebar" class="d-print-none sidebar sidebar-fixed" id="sidebar1" [narrow]="collapsed()" visible>

  <!-- Nombre del sistema (al minimizar se muestran las iniciales) -->
  <c-sidebar-header class="sidebar-brand-header">
    <c-sidebar-brand [routerLink]="['/dashboard']" class="sidebar-brand-link">
      <div class="sidebar-brand-full brand">
        <span class="brand-name">SMART PARKING</span>
        <span class="brand-sub">SYSTEM</span>
      </div>
      <div class="sidebar-brand-narrow brand-initials">SP</div>
    </c-sidebar-brand>
  </c-sidebar-header>

  <!-- INFO DEL USUARIO -->
  <div class="user-info-sidebar">
    <div class="user-row">
      <!-- Avatar (es lo único que queda visible al minimizar) -->
      <div class="user-avatar">
        @if (profilePicture()) {
          <img [src]="profilePicture()" [alt]="fullName()" class="rounded-circle avatar-img" width="44" height="44">
        } @else {
          <div class="avatar-placeholder rounded-circle d-flex align-items-center justify-content-center">
            {{ userInitials() }}
          </div>
        }
      </div>
      
      <!-- Info del Usuario -->
      <div class="user-details flex-grow-1">
        <div class="user-name fw-semibold text-truncate">
          {{ fullName() }}
        </div>
        <div class="user-role mt-1">
          <span class="badge role-badge" [ngClass]="roleBadgeClass()">
            <i class="fas fa-shield-alt me-1"></i>
            {{ activeRole() }}
          </span>
        </div>
      </div>
    </div>
  </div>

  <!-- MENÚ DE NAVEGACIÓN -->
  <ng-scrollbar pointerEventsMethod="scrollbar" visibility="hover">
    <c-sidebar-nav [navItems]="navItems" dropdownMode="close" compact />
  </ng-scrollbar>

  <!-- Botón para minimizar / expandir el menú (solo en escritorio) -->
  <c-sidebar-footer class="sidebar-footer-toggle d-none d-lg-flex" (click)="toggleCollapsed()"
    [title]="collapsed() ? 'Expandir menú' : 'Minimizar menú'">
    <button cSidebarToggler type="button" [attr.aria-label]="collapsed() ? 'Expandir menú' : 'Minimizar menú'"></button>
  </c-sidebar-footer>
</c-sidebar>

<!--CONTENIDO PRINCIPAL-->
<div class="wrapper d-flex flex-column min-vh-100">
  
  <!-- HEADER -->
  <app-default-header 
    [cShadowOnScroll]="'sm'" 
    class="mb-4 d-print-none header header-sticky p-0 shadow-sm"
    position="sticky" 
    sidebarId="sidebar1" />
  
  <!-- BODY -->
  <div class="body flex-grow-1">
    <c-container breakpoint="lg" class="h-auto px-4">
      <router-outlet />
    </c-container>
  </div>
  
  <!-- FOOTER -->
  <app-default-footer />
</div>
