# ================================================================================
# CONFIGURACIÓN LOCAL - Parking Service
# Solo configuración mínima para conectar al Config Server
# ================================================================================

spring:
  application:
    name: parking-service

  # ========== CONFIG SERVER CONNECTION ==========
  config:
    # El .env se carga en cada servicio porque Config Server entrega ${VARIABLE}
    # sin resolver. Las tres rutas cubren los directorios de trabajo habituales.
    import:
      - "optional:file:../../.env[.properties]"      # Maven desde la carpeta del servicio
      - "optional:file:./backend/.env[.properties]"  # IDE abierto en la raíz del monorepo
      - "optional:file:./.env[.properties]"          # IDE abierto en backend/
      - "configserver:http://localhost:8888"

  cloud:
    config:
      enabled: true
      uri: http://localhost:8888
      fail-fast: true  # Fallar si no puede conectar al Config Server