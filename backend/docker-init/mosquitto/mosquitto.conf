# Mosquitto: broker MQTT solo para sensores HC-SR04 y paneles LED.
# Las ESP32-CAM no lo usan (envían la foto por HTTP a iot-service).
# Usuarios y ACL los genera entrypoint.sh al arrancar (no hay contraseñas en el repo).

listener 1883
allow_anonymous false
password_file /mosquitto/data/passwd
acl_file /mosquitto/data/acl

persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice
