# ================================================================================
# ARCHIVO: application.yaml
# config-server/src/main/resources/application.yaml
# ================================================================================
server:
  port: 8888

spring:
  application:
    name: config-server
  profiles:
    active: native

  cloud:
    config:
      server:
        native:
          search-locations: classpath:/config

        # git:
        #   uri: https://github.com/edwinyoner/config-repo
        #   default-label: main
        #   search-paths: config


# Actuator: solo el estado. "refresh" no se usa (ningún servicio tiene @RefreshScope)
management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: never

# Logging
logging:
  level:
    root: INFO
    com.winnersystems: INFO