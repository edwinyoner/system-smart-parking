# ================================================================================
# CONFIGURACIÓN GLOBAL
# config-server/src/main/resources/config/application.yml
# La heredan todos los servicios: aquí solo va lo realmente común.
# El nombre, el datasource y JPA se definen en el archivo de cada servicio.
# ================================================================================

# ========== ACTUATOR ==========
# Sin detalles en /actuator/health: mostrarían el estado de la BD, del correo, etc.
# Los servicios no se publican por el gateway, pero así no dependen de eso.
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: never
