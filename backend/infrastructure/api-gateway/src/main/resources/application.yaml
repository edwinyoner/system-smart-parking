# ================================================================================
# CONFIGURACIÓN LOCAL - API Gateway
# Solo lo mínimo para conectar al Config Server.
# El resto está en config-server/src/main/resources/config/api-gateway.yml
# ================================================================================

spring:
  application:
    name: api-gateway

  # ========== CONFIG SERVER CONNECTION ==========
  # Sin "optional:": si Config Server no responde, el servicio no arranca
  config:
    import: "configserver:http://localhost:8888"
