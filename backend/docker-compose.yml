# ==============================================================================
# SMART PARKING - BASES DE DATOS CON DOCKER
# ==============================================================================
# Proyecto: System Smart Parking
# Autor: Edwin Yoner Flores Rupay
# Fecha: Marzo 2026
# ==============================================================================

services:
  # ============================================================================
  # PostgreSQL 18 - auth-service
  # ============================================================================
  postgres:
    image: postgres:18-alpine
    container_name: db-system-smart-parking-postgres
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker-init/postgres:/docker-entrypoint-initdb.d
    networks:
      - smart-parking-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================================
  # MySQL 8.0 - iot-service
  # ============================================================================
  mysql:
    image: mysql:8.0
    container_name: db-system-smart-parking-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: mysql
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker-init/mysql:/docker-entrypoint-initdb.d
    networks:
      - smart-parking-network
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-pmysql"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================================
  # MongoDB 8 - ia-service
  # Imagen oficial: MongoDB Community Server (latest = 8.0)
  # ============================================================================
  mongodb:
    image: mongodb/mongodb-community-server:latest
    container_name: db-system-smart-parking-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: mongo
    volumes:
      - mongodb_data:/data/db
      - ./docker-init/mongodb:/docker-entrypoint-initdb.d
    networks:
      - smart-parking-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================================
  # Oracle Database 21c XE - parking-service
  # ============================================================================
  oracle:
    image: container-registry.oracle.com/database/express:21.3.0-xe
    container_name: db-system-smart-parking-oracle
    restart: unless-stopped
    ports:
      - "1521:1521"      # SQL*Net (conexiones SQL)
      - "5500:5500"      # EM Express (Oracle Enterprise Manager)
    environment:
      ORACLE_PWD: oracle
      ORACLE_CHARACTERSET: AL32UTF8
    volumes:
      - oracle_data:/opt/oracle/oradata
      - ./docker-init/oracle:/opt/oracle/scripts/startup
    networks:
      - smart-parking-network
    shm_size: 1gb
    healthcheck:
      test: ["CMD-SHELL", "echo 'SELECT 1 FROM DUAL;' | sqlplus -s system/oracle@XE"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G

  # ============================================================================
  # SQL Server 2022 Express - payment-service (un solo contenedor)
  # La imagen de Microsoft no ejecuta scripts al arrancar: docker-init/sqlserver/entrypoint.sh
  # inicia el motor, espera a que responda y ejecuta 01-init.sql (base y usuario del servicio).
  # Contraseñas en backend/.env: MSSQL_SA_PASSWORD (administrador) y
  # MSSQL_USER / MSSQL_PASSWORD (usuario del servicio). SQL Server exige
  # contraseñas de 8 o más caracteres con mayúsculas, minúsculas, números o símbolos.
  # ============================================================================
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: db-system-smart-parking-sqlserver
    restart: unless-stopped
    ports:
      - "1433:1433"
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Express
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Falta MSSQL_SA_PASSWORD en backend/.env}
      MSSQL_USER: ${MSSQL_USER:?Falta MSSQL_USER en backend/.env}
      MSSQL_PASSWORD: ${MSSQL_PASSWORD:?Falta MSSQL_PASSWORD en backend/.env}
      TZ: America/Lima
    volumes:
      - sqlserver_data:/var/opt/mssql
      - ./docker-init/sqlserver:/docker-init:ro
    entrypoint: ["/bin/bash", "/docker-init/entrypoint.sh"]
    networks:
      - smart-parking-network
    # Sano solo si el usuario del servicio entra a su base: confirma que 01-init.sql se ejecutó
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U \"$$MSSQL_USER\" -P \"$$MSSQL_PASSWORD\" -d payment_service_db -C -b -Q 'SELECT 1' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 2G

  # ============================================================================
  # Redis 7 - Cache compartido (BONUS)
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: db-system-smart-parking-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: >
      redis-server
      --requirepass redis123
      --appendonly yes
      --appendfilename "appendonly.aof"
    volumes:
      - redis_data:/data
    networks:
      - smart-parking-network
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================================
  # Mosquitto - broker MQTT (solo sensores HC-SR04 y paneles LED)
  # ============================================================================
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: smart-parking-mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
    environment:
      MQTT_IOT_USERNAME: ${MQTT_IOT_USERNAME:-iot-service}
      MQTT_IOT_PASSWORD: ${MQTT_IOT_PASSWORD:?Falta MQTT_IOT_PASSWORD en backend/.env}
    entrypoint: ["/bin/sh", "/mosquitto/init/entrypoint.sh"]
    volumes:
      - ./docker-init/mosquitto:/mosquitto/init:ro
      - ./docker-init/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto_data:/mosquitto/data
    networks:
      - smart-parking-network
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -h localhost -t smartparking/health -u \"$$MQTT_IOT_USERNAME\" -P \"$$MQTT_IOT_PASSWORD\" -E -W 3"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ============================================================================
  # MinIO - S3 compatible storage (BONUS)
  # ============================================================================
  minio:
    image: minio/minio:latest
    container_name: smart-parking-minio
    restart: unless-stopped
    ports:
      - "9000:9000"      # API
      - "9001:9001"      # Console Web
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    volumes:
      - minio_data:/data
    networks:
      - smart-parking-network
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3

# ==============================================================================
# VOLUMES (Persistencia de datos)
# ==============================================================================
volumes:
  postgres_data:
    driver: local
  mysql_data:
    driver: local
  mongodb_data:
    driver: local
  oracle_data:
    driver: local
  sqlserver_data:
    driver: local
  redis_data:
    driver: local
  mosquitto_data:
    driver: local
  minio_data:
    driver: local

# ==============================================================================
# NETWORKS (Red interna para comunicación entre contenedores)
# ==============================================================================
networks:
  smart-parking-network:
    driver: bridge